<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{APP_NAME}} - 登录</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<style>
:root{--bg0:#08090f;--bg1:#0e1019;--bg2:#151825;--bg3:#1c2035;--bd:#2a3050;--t1:#e8ecf8;--t2:#8a94b8;--t3:#525e80;--ac:#00d4aa;--acd:rgba(0,212,170,.1);--dg:#ff4757;--r:8px;--rl:14px;--sh:0 10px 40px rgba(0,0,0,.6)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg0);color:var(--t1);min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.bg{position:fixed;inset:0;background:radial-gradient(ellipse 70% 50% at 25% 25%,rgba(0,212,170,.07)0%,transparent 60%),radial-gradient(ellipse 50% 60% at 80% 75%,rgba(76,201,240,.05)0%,transparent 60%),var(--bg0)}
.grid{position:fixed;inset:0;background-image:linear-gradient(var(--bd) 1px,transparent 1px),linear-gradient(90deg,var(--bd) 1px,transparent 1px);background-size:60px 60px;opacity:.1;mask-image:radial-gradient(ellipse 70% 70% at center,black,transparent)}
.card{position:relative;z-index:2;background:var(--bg2);border:1px solid var(--bd);border-radius:var(--rl);padding:36px 28px;width:420px;max-width:92vw;box-shadow:var(--sh);animation:slideUp .5s ease}
@keyframes slideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
h1{text-align:center;font-size:22px;font-weight:700;margin-bottom:4px}
.sub{text-align:center;color:var(--t2);font-size:13px;margin-bottom:24px}
.card input{width:100%;background:var(--bg1);border:1px solid var(--bd);border-radius:var(--r);padding:11px 14px;color:var(--t1);font-family:inherit;font-size:15px;outline:none;transition:.2s ease;margin-bottom:12px}
.card input:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--acd)}
/* 密码框右侧的小眼睛：自带 SVG，不依赖 Font Awesome CDN（局域网离线时图标也不能消失） */
.pw{position:relative}
/* 用 .card .pw 提高优先级：窄屏媒体查询里的 .card input 会重置 padding，别把眼睛压到框里 */
.card .pw input{padding-right:48px}
.card .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;padding:0;background:transparent;border:none;border-radius:6px;color:var(--t3);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:color .2s,background .2s}
.card .eye:hover{color:var(--t1);background:rgba(255,255,255,.06)}
.card .eye svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.card button{width:100%;padding:12px;background:var(--ac);color:#080a0f;border:none;border-radius:var(--r);font-size:15px;font-weight:600;cursor:pointer;transition:opacity .2s;font-family:inherit}
.card button:hover{opacity:.9}
.error{background:rgba(255,71,87,.12);color:var(--dg);padding:10px 14px;border-radius:8px;margin-bottom:16px;text-align:center;font-size:14px}
@media(max-width:480px){
    .card{padding:24px 18px}
    .card input{padding:13px 14px;font-size:16px}
    .card button{padding:14px;font-size:16px}
}
/* <pnsBrandCss> */
/* PocketNAS 共用品牌片段 —— 单一真源
 * 消费方（三处，CSS 内容一字不差）：
 *   PC    easy_webdav/src/WebDAVService/web/browse.html   .pnsIc / .pnsNm / .pnsSfx
 *   PC    easy_webdav/src/WebDAVService/web/login.html    .brandRow + .lg 变体
 *   手机  app/src/main/java/com/filemgr/net/BrowsePages.kt  BRAND_CSS
 * 图标素材：src/PocketNAS.PC/Assets/brand/pocketnas_64.png
 *   —— 深色圆角方块 + 橙色 p。只保留这一个方块标志，软件名交给 HTML 文本：
 *      以前把 wordmark 整张图嵌进来，字是图片里的死字，副标题还多占一行，
 *      想调字号/颜色只能重新出图。现在一行 = 小标志 + PocketNAS + 更小的 -PC/-Phone。
 * 改这里或换素材后，跑 `python tools/sync-brand.py` 同步两端，勿在页面/Kotlin 里手改生成块。
 * 用内嵌 base64 而不是 <img src="...png">：PC 服务只 serve 三个 HTML 模板，没有静态资源路由。
 */
.pnsIc{display:block;width:24px;height:24px;flex:0 0 auto;object-fit:contain;
  background:transparent;border:0}
.pnsNm{font-size:15px;font-weight:700;color:#fff;letter-spacing:.01em;line-height:1;white-space:nowrap}
/* 后缀：同一行、全白、字号明显比软件名小一档，不加底色小签 */
.pnsSfx{font-size:10px;font-weight:600;letter-spacing:.05em;color:#fff;opacity:.62;
  line-height:1;white-space:nowrap;align-self:center;margin-left:1px}
/* 登录页大号：标志 44、名字 26、后缀 13 */
.pnsIc.lg{width:44px;height:44px}
.pnsNm.lg{font-size:26px}
.pnsNm.lg + .pnsSfx{font-size:13px;opacity:.7}
/* 登录页：标志 / 名字 / 后缀 同一行居中 */
.brandRow{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 auto 22px}
@media(max-width:768px){
  .pnsIc{width:22px;height:22px}
  .pnsNm{font-size:14px}
  .pnsIc.lg{width:38px;height:38px}
  .pnsNm.lg{font-size:22px}
  .brandRow{margin-bottom:18px;gap:8px}
}
/* </pnsBrandCss> */
</style>
</head>

<div class="grid"></div>
<div class="card">

<form method="post">
<input type="text" name="username" placeholder="用户名" required autofocus>
<div class="pw">
<input type="password" name="password" id="pw" placeholder="密码" required>
<button type="button" class="eye" id="eye" title="显示密码" aria-label="显示密码" onclick="togglePw()">
<svg viewBox="0 0 24 24" id="eyeOn"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
<svg viewBox="0 0 24 24" id="eyeOff" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
</button>
</div>
<button type="submit"><i class="fas fa-right-to-bracket"></i> 登 录</button>
</form>
</div>
<script>
function togglePw(){
    var i=document.getElementById('pw'),on=document.getElementById('eyeOn'),
        off=document.getElementById('eyeOff'),btn=document.getElementById('eye');
    var show=i.type==='password';
    i.type=show?'text':'password';
    on.style.display=show?'none':'block';
    off.style.display=show?'block':'none';
    btn.title=show?'隐藏密码':'显示密码';
    btn.setAttribute('aria-label',btn.title);
    i.focus();
}
</script>
</body>
</html>
